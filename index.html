<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คุณวนัช</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💐</text></svg>">
    
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fff0f5; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Kanit', sans-serif;
            overflow: hidden;
            flex-direction: column;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* --- กล่องของขวัญ --- */
        .box-container {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s;
            margin-bottom: 20px;
        }

        .custom-box {
            position: relative;
            width: 120px;
            height: 100px;
            background-color: #ffb6c1;
            border-radius: 5px;
            margin: 0 auto;
            margin-top: 20px;
        }

        .custom-box::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 20px;
            background-color: #fff;
            opacity: 0.8;
        }

        .custom-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50px;
            width: 20px;
            height: 100%;
            background-color: #fff;
            opacity: 0.8;
        }

        .box-lid {
            position: absolute;
            top: -20px;
            left: -10px;
            width: 140px;
            height: 30px;
            background-color: #ff99a8;
            border-radius: 5px;
            z-index: 2;
            box-shadow: 0 4px 5px rgba(0,0,0,0.1);
        }

        .box-lid::after {
            content: '';
            position: absolute;
            top: 0;
            left: 60px;
            width: 20px;
            height: 100%;
            background-color: #fff;
            opacity: 0.8;
        }

        .shake {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-5deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-5deg); }
            80% { transform: translate(-1px, -1px) rotate(5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-5deg); }
        }

        .content {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: popUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- สวนดอกไม้ --- */
        .garden {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 200px;
            margin-bottom: 20px;
        }

        .flower-wrapper {
            position: relative;
            width: 90px;
            height: 180px;
            transform-origin: bottom center;
        }

        .fw-left {
            animation: swayLeft 3s ease-in-out infinite alternate;
            margin-right: -30px;
            z-index: 1;
        }
        .fw-center {
            animation: swayCenter 3.5s ease-in-out infinite alternate;
            z-index: 3;
        }
        .fw-right {
            animation: swayRight 4s ease-in-out infinite alternate;
            margin-left: -30px;
            z-index: 2;
        }

        @keyframes swayLeft {
            0% { transform: scale(0.75) rotate(-20deg); }
            100% { transform: scale(0.75) rotate(-10deg); }
        }
        @keyframes swayCenter {
            0% { transform: scale(1) rotate(-5deg); }
            100% { transform: scale(1) rotate(5deg); }
        }
        @keyframes swayRight {
            0% { transform: scale(0.85) rotate(10deg); }
            100% { transform: scale(0.85) rotate(20deg); }
        }

        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 120px;
            background-color: #8cd088;
            border-radius: 4px;
        }

        .leaf {
            position: absolute;
            width: 35px;
            height: 35px;
            background-color: #8cd088;
            border-radius: 0 35px 0 35px;
        }

        .leaf.left { bottom: 30px; left: 10px; transform: rotate(-30deg); }
        .leaf.right { bottom: 50px; right: 10px; transform: rotate(60deg); }

        .flower-head {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            z-index: 2;
            opacity: 0;
        }

        .fw-center .flower-head { animation: bloom 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.2s; }
        .fw-left .flower-head { animation: bloom 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.6s; }
        .fw-right .flower-head { animation: bloom 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1s; }

        .petal {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            top: 22px;
            left: 22px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .petal:nth-child(1) { background: #ff9aa2; transform: translate(0, -35px); }
        .petal:nth-child(2) { background: #ffdac1; transform: translate(30px, -18px); }
        .petal:nth-child(3) { background: #e2f0cb; transform: translate(30px, 18px); }
        .petal:nth-child(4) { background: #b5ead7; transform: translate(0, 35px); }
        .petal:nth-child(5) { background: #c7ceea; transform: translate(-30px, 18px); }
        .petal:nth-child(6) { background: #ffb7b2; transform: translate(-30px, -18px); }

        .center {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ffe180;
            border-radius: 50%;
            top: 25px;
            left: 25px;
            z-index: 3;
            box-shadow: 0 0 15px rgba(255, 225, 128, 0.8);
        }

        @keyframes bloom {
            0% { transform: translateX(-50%) scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
        }

        /* --- กล่องข้อความใต้ดอกไม้ --- */
        .message-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 30px;
            border-radius: 15px;
            border: 2px dashed #ffb6c1;
            box-shadow: 0 10px 20px rgba(232, 139, 163, 0.2);
            color: #d16b8c;
            font-size: 1.2rem;
            line-height: 1.6;
            max-width: 80%;
            opacity: 0;
            animation: fadeInMessage 1s ease-in forwards 1.5s; 
        }

        @keyframes fadeInMessage {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hint {
            color: #e88ba3;
            margin-top: 15px;
            font-size: 1.3rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

    </style>
</head>
<body>

    <audio id="bg-music" loop autoplay>
        <source src="pun.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="main-container">
        
        <div class="box-container" id="box">
            <div class="custom-box">
                <div class="box-lid"></div>
            </div>
        </div>
        
        <div class="hint" id="hint">ลองเคาะกล่องดูสิ!</div>
        
        <div class="content" id="content">
            
            <div class="garden">
                <div class="flower-wrapper fw-left">
                    <div class="stem"></div>
                    <div class="leaf left"></div>
                    <div class="flower-head">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="center"></div>
                    </div>
                </div>

                <div class="flower-wrapper fw-center">
                    <div class="stem"></div>
                    <div class="leaf left"></div><div class="leaf right"></div>
                    <div class="flower-head">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="center"></div>
                    </div>
                </div>

                <div class="flower-wrapper fw-right">
                    <div class="stem"></div>
                    <div class="leaf right"></div>
                    <div class="flower-head">
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
                        <div class="center"></div>
                    </div>
                </div>
            </div>
            
            <div class="message-box">
                <strong>ถึงวนัช 💐</strong><br><br>
                ขอให้มีวันที่ดีในทุกๆวัน<br>
                และได้กินของอร่อยทุกวันนะครับ
            </div>
            
        </div>
    </div>

    <script>
        let tapCount = 0;
        let isMusicPlaying = false;
        const box = document.getElementById('box');
        const hint = document.getElementById('hint');
        const content = document.getElementById('content');
        const bgMusic = document.getElementById('bg-music');

        bgMusic.volume = 0.5;

        // พยายามเล่นเพลงทันทีเมื่อเว็บโหลดเสร็จ
        window.addEventListener('DOMContentLoaded', () => {
            let playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("เบราว์เซอร์บล็อก autoplay ต้องรอผู้ใช้เคาะกล่องก่อน");
                });
            }
        });

        box.addEventListener('click', () => {
            // ถ้าเพลงยังไม่เล่น จะเล่นทันทีที่เคาะกล่อง
            if (!isMusicPlaying) {
                bgMusic.play();
                isMusicPlaying = true;
            }

            tapCount++;
            
            if (tapCount < 3) {
                box.classList.remove('shake');
                void box.offsetWidth;
                box.classList.add('shake');
                hint.innerText = tapCount === 1 ? 'เคาะอีกนิดสิ!' : 'ใกล้จะเปิดแล้ว!';
            } else if (tapCount === 3) {
                box.style.display = 'none';
                hint.style.display = 'none';
                content.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
